<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age of The Dead — Sign In</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="shortcut icon" href="img/favicoin.png" type="image/x-icon">
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">
    <span>HERA Studio</span>
  </a>
  <div class="nav-links">
    <a href="index.html" data-en="Home" data-es="Inicio">Home</a>
    <a href="leaderboard.html" data-en="Leaderboard" data-es="Ranking">Leaderboard</a>
  </div>
  <div class="nav-right">
    <button id="lang-btn" onclick="toggleLang()">EN / ES</button>
    <a href="register.html" class="btn btn-primary" data-en="Register" data-es="Registrarse">Register</a>
  </div>
</nav>

<div class="page-wrap auth-bg">
  <div class="auth-wrap fade-in">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-title" data-en="Welcome Back" data-es="Bienvenido">Welcome Back</div>
        <div class="auth-sub" data-en="Sign in to your account" data-es="Inicia sesión en tu cuenta">Sign in to your account</div>
      </div>

      <div class="form-group">
        <label data-en="Email" data-es="Email">Email</label>
        <input type="email" id="login-email" placeholder="warrior@example.com">
        <span class="form-error" id="err-email"></span>
      </div>
      <div class="form-group">
        <label data-en="Password" data-es="Contraseña">Password</label>
        <input type="password" id="login-pass" placeholder="••••••••">
        <span class="form-error" id="err-pass"></span>
      </div>

      <button class="btn btn-primary btn-block" id="btn-login" onclick="doLogin()" data-en="⚔️ Sign In" data-es="⚔️ Entrar">⚔️ Sign In</button>

      <div class="form-footer">
        <a href="#" onclick="showForgot()" data-en="Forgot password?" data-es="¿Olvidaste tu contraseña?">Forgot password?</a>
        &nbsp;·&nbsp;
        <span data-en="No account? " data-es="¿Sin cuenta? ">No account? </span>
        <a href="register.html" data-en="Register" data-es="Registrarse">Register</a>
      </div>
    </div>

    <div class="auth-card" id="forgot-card" style="display:none;margin-top:1rem">
      <div class="auth-header">
        <div class="auth-title" style="font-size:1.1rem" data-en="Reset Password" data-es="Recuperar Contraseña">Reset Password</div>
      </div>
      <div class="form-group">
        <label data-en="Your email" data-es="Tu email">Your email</label>
        <input type="email" id="forgot-email" placeholder="you@example.com">
      </div>
      <button class="btn btn-primary btn-block" onclick="doForgot()" data-en="Send Reset Link" data-es="Enviar Enlace">Send Reset Link</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/api.js"></script>
<script>
if(Auth.isLoggedIn()) window.location.href = 'profile.html';

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  document.getElementById('err-email').textContent = '';
  document.getElementById('err-pass').textContent  = '';

  if(!email){ document.getElementById('err-email').textContent = 'Email required'; return; }
  if(!pass){  document.getElementById('err-pass').textContent  = 'Password required'; return; }

  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    await AuthAPI.login(email, pass);
    showToast('Welcome back!','success');
    setTimeout(() => window.location.href = 'profile.html', 900);
  } catch(e) {
    showToast(e.message || 'Login failed','error');
    btn.disabled = false;
    btn.textContent = '⚔️ Sign In';
  }
}

function showForgot(){
  const fc = document.getElementById('forgot-card');
  fc.style.display = fc.style.display === 'none' ? 'block' : 'none';
}

async function doForgot(){
  const email = document.getElementById('forgot-email').value.trim();
  if(!email){ showToast('Enter your email','error'); return; }
  try {
    await AuthAPI.forgotPassword(email);
    showToast('Reset email sent!','success');
    document.getElementById('forgot-card').style.display = 'none';
  } catch(e) {
    showToast(e.message,'error');
  }
}

document.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/interactions.js"></script>
</body>
</html>
