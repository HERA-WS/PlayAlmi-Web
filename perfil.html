<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Age of The Death</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .profile-page {
      min-height: 100vh;
      padding: 6rem 1.5rem 4rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 2rem;
      align-items: start;
      opacity: 0;
      animation: fadeInUp 0.7s ease 0.1s forwards;
    }

    /* LEFT PANEL */
    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2.5rem 2rem;
      text-align: center;
      position: relative;
    }

    .profile-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-blue), transparent);
    }

    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .avatar-img {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 3px solid var(--accent-purple);
      object-fit: cover;
      box-shadow: 0 0 30px rgba(123, 94, 167, 0.4);
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.5rem;
      color: white;
    }

    .avatar-img img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .avatar-upload-btn {
      position: absolute;
      bottom: 0; right: 0;
      width: 34px; height: 34px;
      background: var(--accent-purple);
      border: 2px solid var(--bg-card);
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
      transition: background 0.3s;
    }

    .avatar-upload-btn:hover {
      background: var(--accent-glow);
    }

    #avatar-input { display: none; }

    .profile-username {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .profile-email {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.3rem;
      color: var(--accent-glow);
      display: block;
    }

    .stat-label {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .member-since {
      margin-top: 1.5rem;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* RIGHT PANEL */
    .profile-right {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2rem;
      position: relative;
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: linear-gradient(180deg, var(--accent-purple), var(--accent-blue));
    }

    .panel-title {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .btn-sm {
      padding: 10px 24px;
      font-size: 0.7rem;
    }

    /* HISTORY TABLE */
    .history-table {
      width: 100%;
      border-collapse: collapse;
    }

    .history-table th {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .history-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(42,32,64,0.4);
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .history-table td:first-child {
      font-family: 'Cinzel Decorative', serif;
      color: var(--accent-glow);
    }

    .difficulty-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 2px 8px;
      border: 1px solid;
    }

    .difficulty-badge.easy { color: #27ae60; border-color: #27ae60; background: rgba(39,174,96,0.1); }
    .difficulty-badge.medium { color: #f1c40f; border-color: #f1c40f; background: rgba(241,196,15,0.1); }
    .difficulty-badge.hard { color: #c0392b; border-color: #c0392b; background: rgba(192,57,43,0.1); }

    .empty-history {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }

    @media (max-width: 768px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">
      <img src="img/logo.png" alt="HERA" />
      <span>Age of The Death</span>
    </a>
    <button class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="ranking.html">Ranking</a></li>
      <li id="nav-profile" style="display:none"><a href="perfil.html">Profile</a></li>
      <li id="nav-username-li" style="display:none">
        <span id="nav-username" style="font-family:'Cinzel',serif;font-size:0.75rem;color:var(--accent-glow);letter-spacing:0.1em;"></span>
      </li>
      <li id="nav-logout" style="display:none"><a href="#" class="btn-nav">Logout</a></li>
      <li id="nav-login"><a href="login.html" class="btn-nav">Login</a></li>
      <li id="nav-register"><a href="register.html">Register</a></li>
    </ul>
  </nav>

  <main class="profile-page">
    <div class="profile-grid">

      <!-- LEFT: Profile Card -->
      <div>
        <div class="profile-card">
          <div class="alert alert-success" id="alert-success" style="margin-bottom:1rem;"></div>
          <div class="alert alert-error" id="alert-error" style="margin-bottom:1rem;"></div>

          <div class="avatar-wrapper">
            <div class="avatar-img" id="avatar-display">?</div>
            <label class="avatar-upload-btn" for="avatar-input" title="Change avatar">✏️</label>
            <input type="file" id="avatar-input" accept="image/*" />
          </div>

          <h2 class="profile-username" id="profile-username">Loading...</h2>
          <p class="profile-email" id="profile-email"></p>

          <div class="profile-stats">
            <div class="stat-item">
              <span class="stat-value" id="stat-best">—</span>
              <span class="stat-label">Best Score</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="stat-games">—</span>
              <span class="stat-label">Games</span>
            </div>
          </div>

          <p class="member-since" id="member-since"></p>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="profile-right">

        <!-- Edit Profile -->
        <div class="panel">
          <h3 class="panel-title">Edit Profile</h3>
          <form id="edit-form" novalidate>
            <div class="form-group">
              <label for="edit-username">Username</label>
              <input type="text" id="edit-username" />
              <span class="form-error" id="error-username">Minimum 3 characters.</span>
            </div>
            <div class="form-group">
              <label for="edit-email">Email</label>
              <input type="email" id="edit-email" />
              <span class="form-error" id="error-email">Enter a valid email.</span>
            </div>
            <button type="submit" class="btn-primary btn-sm" id="btn-save">Save Changes</button>
          </form>
        </div>

        <!-- Score History -->
        <div class="panel">
          <h3 class="panel-title">Score History</h3>
          <div id="history-content">
            <div class="empty-history">Loading scores...</div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    if (!isLoggedIn()) window.location.href = 'login.html';

    async function loadProfile() {
      try {
        const user = await apiRequest('/auth/profile');
        $('#profile-username').text(user.username);
        $('#profile-email').text(user.email);
        $('#edit-username').val(user.username);
        $('#edit-email').val(user.email);

        const joined = new Date(user.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
        $('#member-since').text('Member since ' + joined);

        if (user.avatar) {
          $('#avatar-display').html(`<img src="${user.avatar}" alt="${user.username}" />`);
        } else {
          $('#avatar-display').text(user.username[0].toUpperCase());
        }

        localStorage.setItem('username', user.username);
        localStorage.setItem('avatar', user.avatar || '');
        updateNavbar();
      } catch (e) {
        if (e.message === 'Token inválido') {
          removeToken();
          window.location.href = 'login.html';
        }
      }
    }

    async function loadHistory() {
      try {
        const data = await apiRequest('/scores/history');
        if (!data.length) {
          $('#history-content').html('<div class="empty-history">No scores yet. Start playing!</div>');
          $('#stat-games').text('0');
          $('#stat-best').text('0');
          return;
        }

        $('#stat-games').text(data.length);
        const best = Math.max(...data.map(s => s.score));
        $('#stat-best').text(best.toLocaleString());

        const rows = data.slice(0, 10).map(item => `
          <tr>
            <td>${item.score.toLocaleString()}</td>
            <td>Lvl ${item.level}</td>
            <td><span class="difficulty-badge ${item.difficulty}">${item.difficulty}</span></td>
            <td>${new Date(item.createdAt).toLocaleDateString()}</td>
          </tr>
        `).join('');

        $('#history-content').html(`
          <table class="history-table">
            <thead>
              <tr>
                <th>Score</th>
                <th>Level</th>
                <th>Difficulty</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `);
      } catch (e) {
        $('#history-content').html('<div class="empty-history">Error loading scores.</div>');
      }
    }

    // Avatar upload
    $('#avatar-input').on('change', async function () {
      const file = this.files[0];
      if (!file) return;

      if (file.size > 2 * 1024 * 1024) {
        $('#alert-error').text('Image must be under 2MB.').addClass('show');
        return;
      }

      const reader = new FileReader();
      reader.onload = async function (e) {
        const base64 = e.target.result;
        try {
          await apiRequest('/auth/avatar', 'PUT', { avatar: base64 });
          $('#avatar-display').html(`<img src="${base64}" alt="avatar" />`);
          localStorage.setItem('avatar', base64);
          $('#alert-success').text('Avatar updated!').addClass('show');
          setTimeout(() => $('#alert-success').removeClass('show'), 3000);
        } catch (err) {
          $('#alert-error').text(err.message).addClass('show');
        }
      };
      reader.readAsDataURL(file);
    });

    // Edit form
    $('#edit-form').on('submit', async function (e) {
      e.preventDefault();

      const username = $('#edit-username').val().trim();
      const email = $('#edit-email').val().trim();
      let valid = true;

      if (!username || username.length < 3) {
        $('#edit-username').addClass('error');
        $('#error-username').addClass('show');
        valid = false;
      } else {
        $('#edit-username').removeClass('error');
        $('#error-username').removeClass('show');
      }

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        $('#edit-email').addClass('error');
        $('#error-email').addClass('show');
        valid = false;
      } else {
        $('#edit-email').removeClass('error');
        $('#error-email').removeClass('show');
      }

      if (!valid) return;

      $('#btn-save').text('Saving...').prop('disabled', true);
      try {
        await apiRequest('/auth/profile', 'PUT', { username, email });
        localStorage.setItem('username', username);
        $('#profile-username').text(username);
        updateNavbar();
        $('#alert-success').text('Profile updated!').addClass('show');
        setTimeout(() => $('#alert-success').removeClass('show'), 3000);
      } catch (err) {
        $('#alert-error').text(err.message).addClass('show');
      }
      $('#btn-save').text('Save Changes').prop('disabled', false);
    });

    loadProfile();
    loadHistory();
  </script>
</body>
</html>
