<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age of The Dead — Register</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="shortcut icon" href="img/favicoin.png" type="image/x-icon">
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">
    <img src="img/LogoEmpresa.png" alt="">
    <span>HERA Studio</span>
  </a>
  <div class="nav-links">
    <a href="index.html" data-en="Home" data-es="Inicio">Home</a>
    <a href="leaderboard.html" data-en="Leaderboard" data-es="Ranking">Leaderboard</a>
  </div>
  <div class="nav-right">
    <button id="lang-btn" onclick="toggleLang()">EN / ES</button>
    <a href="login.html" class="btn btn-outline" data-en="Sign In" data-es="Entrar">Sign In</a>
  </div>
</nav>

<div class="page-wrap auth-bg">
  <div class="auth-wrap fade-in">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-title" data-en="Create Account" data-es="Crear Cuenta">Create Account</div>
        <div class="auth-sub" data-en="Join the fight. Claim your place on the board." data-es="Únete a la lucha. Reclama tu lugar en el ranking.">Join the fight. Claim your place on the board.</div>
      </div>

      <div class="form-group">
        <label data-en="Username" data-es="Usuario">Username</label>
        <input type="text" id="reg-user" placeholder="DeadSlayer99" maxlength="20">
        <span class="form-error" id="err-user"></span>
      </div>
      <div class="form-group">
        <label data-en="Email" data-es="Email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com">
        <span class="form-error" id="err-email"></span>
      </div>
      <div class="form-group">
        <label data-en="Password" data-es="Contraseña">Password</label>
        <input type="password" id="reg-pass" placeholder="Min. 8 characters">
        <span class="form-error" id="err-pass"></span>
      </div>
      <div class="form-group">
        <label data-en="Confirm Password" data-es="Confirmar Contraseña">Confirm Password</label>
        <input type="password" id="reg-pass2" placeholder="Repeat password">
        <span class="form-error" id="err-pass2"></span>
      </div>

      <div class="form-group">
        <label data-en="Avatar (optional)" data-es="Avatar (opcional)">Avatar (optional)</label>
        <div class="avatar-preview-wrap">
          <div class="avatar-preview-box" id="avatar-preview" onclick="document.getElementById('reg-avatar').click()">
            <span>🧟</span>
            <small data-en="Click to upload" data-es="Click para subir">Click to upload</small>
          </div>
          <input type="file" id="reg-avatar" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="previewAvatar(event)">
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="btn-reg" onclick="doRegister()" data-en="⚔️ Create Account" data-es="⚔️ Crear Cuenta">⚔️ Create Account</button>

      <div class="form-footer">
        <span data-en="Already have an account? " data-es="¿Ya tienes cuenta? ">Already have an account? </span>
        <a href="login.html" data-en="Sign In" data-es="Entrar">Sign In</a>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/api.js"></script>
<script>
if(Auth.isLoggedIn()) window.location.href = 'profile.html';

let avatarBase64 = '';

function previewAvatar(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    avatarBase64 = ev.target.result; // full data:image base64
    const box = document.getElementById('avatar-preview');
    box.innerHTML = `<img src="${avatarBase64}" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`;
  };
  reader.readAsDataURL(file);
}

async function doRegister(){
  // Clear errors
  ['user','email','pass','pass2'].forEach(f => document.getElementById('err-'+f).textContent = '');

  const username = document.getElementById('reg-user').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const pass     = document.getElementById('reg-pass').value;
  const pass2    = document.getElementById('reg-pass2').value;

  let valid = true;
  if(!username){ document.getElementById('err-user').textContent = 'Username required'; valid=false; }
  if(!email)   { document.getElementById('err-email').textContent = 'Email required'; valid=false; }
  if(pass.length < 8){ document.getElementById('err-pass').textContent = 'Minimum 8 characters'; valid=false; }
  if(pass !== pass2) { document.getElementById('err-pass2').textContent = 'Passwords do not match'; valid=false; }
  if(!valid) return;

  const btn = document.getElementById('btn-reg');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  try {
    await AuthAPI.register(username, email, pass);
    // Auto login after register
    await AuthAPI.login(email, pass);
    // Upload avatar if provided
    if(avatarBase64){
      try { await AuthAPI.updateAvatar(avatarBase64); } catch(_){}
    }
    showToast('Account created! Welcome!','success');
    setTimeout(() => window.location.href = 'profile.html', 900);
  } catch(e){
    showToast(e.message || 'Registration failed','error');
    btn.disabled = false;
    btn.setAttribute('data-en','⚔️ Create Account');
    btn.textContent = '⚔️ Create Account';
  }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/interactions.js"></script>
</body>
</html>
